<!DOCTYPE html>
<html lang="en" data-theme="darkroom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — KRONOS ATELIER</title>
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/fonts.css">
<style>
  :root{
    --serif:'Instrument Serif',Georgia,serif;
    --mono:'IBM Plex Mono',monospace;
    --sans:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;background:#0A0A09;color:#F2EFE7;
    font-family:var(--sans);
    display:grid;grid-template-rows:auto 1fr auto;
    padding:26px clamp(18px,3.4vw,54px) 22px;
    background-image:radial-gradient(120% 90% at 50% 40%,#131312 0%,#0A0A09 70%);
  }
  .top{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:rgba(242,239,231,.4)}
  .top a{color:inherit;text-decoration:none}
  main{display:grid;place-items:center;text-align:center;padding:40px 0}
  h1{font-family:var(--serif);font-weight:400;margin:0;
     font-size:clamp(90px,26vw,340px);line-height:.78;letter-spacing:-.03em}
  h1 em{font-style:italic;color:#C8A87C}
  p{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(242,239,231,.45);
    margin:22px 0 0;text-transform:uppercase}
  a.back{display:inline-block;margin-top:30px;padding:13px 22px;
    border:1px solid rgba(242,239,231,.3);color:#F2EFE7;text-decoration:none;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;transition:.35s}
  a.back:hover{background:#F2EFE7;color:#0A0A09;border-color:#F2EFE7}
  .bot{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:8.5px;letter-spacing:.16em;color:rgba(242,239,231,.28)}
</style>
</head>
<body>
  <div class="top">
    <span>KRONOS — ATELIER</span>
    <span>38°43'N / 9°08'W</span>
  </div>
  <main>
    <div>
      <h1>4<em>0</em>4</h1>
      <p>This frame was never developed.</p>
      <a class="back" href="./">← BACK TO THE INDEX</a>
    </div>
  </main>
  <div class="bot">
    <span>ERROR — NO NEGATIVE FOUND</span>
    <span>LISBON · MILAN</span>
  </div>
</body>
</html>
